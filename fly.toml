# Fly.io: `fly launch --copy-config --no-deploy` uses this file. Change `app` to a name of
# your own first (it becomes https://<app>.fly.dev, which Lintel uses until you set
# PUBLIC_URL), and `primary_region` to one near your visitors. See packages/docs
# hosting/fly.
app = "my-lintel"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  # One machine that keeps running: its volume belongs to it, and timed jobs need it awake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[mounts]
  source = "lintel_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
