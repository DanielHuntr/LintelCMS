name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres for the tests that need one (see packages/core/src/testing).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lintel
          POSTGRES_PASSWORD: lintel
          POSTGRES_DB: lintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lintel:lintel@localhost:5432/lintel_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
