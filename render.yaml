# Render Blueprint: Lintel and a Postgres database for it. Render's "New → Blueprint" (or the
# Deploy to Render button in the hosting guide) reads this file. Lintel takes its address
# from Render until you set PUBLIC_URL for your own domain. See packages/docs hosting/render.
services:
  - type: web
    name: lintel
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A disk needs a paid instance; uploads, resized images and saved settings live on it.
    plan: starter
    healthCheckPath: /ready
    disk:
      name: lintel-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lintel-database
          property: connectionString

databases:
  - name: lintel-database
    databaseName: lintel
    user: lintel
    plan: basic-256mb
    postgresMajorVersion: "17"
