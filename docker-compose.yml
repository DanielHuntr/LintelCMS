# Local services for development: `pnpm db:up` to start, `pnpm db:down` to stop.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lintel
      POSTGRES_PASSWORD: lintel
      POSTGRES_DB: lintel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lintel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
