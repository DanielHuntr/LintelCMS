# Lintel in production: Lintel, Postgres and (optionally) Caddy for automatic HTTPS.
# The step-by-step guide is "Hosting on a VPS with Docker" in the docs.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --profile https up -d --build
#
# Leave out `--profile https` if something else (a load balancer, another proxy) already
# handles HTTPS; Lintel is then on port 4000 of this machine only.
name: lintel

services:
  lintel:
    build:
      context: ..
      dockerfile: Dockerfile
    image: lintel:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lintel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/lintel
    volumes:
      # The setup screen's saved settings, resized images and the email outbox.
      - lintel-data:/data
      # Uploaded files, in their own volume so they are easy to back up on their own.
      - lintel-uploads:/data/uploads
    ports:
      # Only this machine can reach Lintel directly; visitors come through Caddy.
      - "127.0.0.1:${LINTEL_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lintel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lintel"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      LINTEL_DOMAIN: ${LINTEL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's certificates. Keep this volume, or Let's Encrypt may rate-limit new ones.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lintel

volumes:
  lintel-data:
  lintel-uploads:
  postgres-data:
  caddy-data:
  caddy-config:
